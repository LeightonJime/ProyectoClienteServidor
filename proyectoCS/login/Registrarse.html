<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse – Biblioteca Pública de Heredia</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/normalize.css">
    <link rel="stylesheet" href="../icomoon/icomoon.css">
    <link rel="stylesheet" href="../css/vendor.css">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../login/login-style.css">
</head>
<body>
    <header class="py-3 border-bottom">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="../index.html" class="text-decoration-none fs-5">📚 Biblioteca Pública de Heredia</a>
            <nav class="d-none d-md-block">
                <a href="../index.html#featured-books" class="me-3">Destacados</a>
                <a href="../index.html#popular-books">Populares</a>
            </nav>
        </div>
    </header>

    <main class="container my-5">
        <h2 class="mb-4">Crear Cuenta</h2>
        <form action="http://localhost/ProyectoClienteServidor/proyectoCS/login/registrarse.php" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Nombre de usuario:</label>
                <input type="text" id="username" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email:</label>
                <input type="email" id="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña:</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="confirm-password" class="form-label">Confirmar Contraseña:</label>
                <input type="password" id="confirm-password" name="confirm-password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-dark">Registrarse</button>
        </form>
        <p>¿Ya tienes cuenta? <a href="../login/login.html">Inicia Sesión</a></p>
    </main>

    <footer class="border-top py-4">
        <div class="container small text-muted">© 2025 Biblioteca Pública de Heredia</div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
